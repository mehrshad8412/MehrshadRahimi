<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>صفحه ثبت‌نام</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="register-card">
    <!-- عنوان خوش‌آمدید -->
    <h1 class="welcome-title">خوش آمدید 👋</h1>
    <p class="welcome-subtitle">برای ایجاد حساب کاربری اطلاعات زیر را وارد کنید</p>

    <!-- فرم ثبت‌نام -->
    <form action="#" method="post">
      <div class="input-group">
        <label for="fullname">نام و نام خانوادگی</label>
        <input 
          type="text" 
          id="fullname" 
          name="fullname" 
          placeholder="مثلاً علی محمدی" 
          required
        >
      </div>

      <!-- شماره تلفن -->
      <div class="input-group">
        <label for="phone">شماره تلفن</label>
        <input 
          type="tel" 
          id="phone" 
          name="phone" 
          placeholder="09123456789" 
          pattern="[0-9]{11}"
          required
        >
      </div>

      <!-- ایمیل -->
      <div class="input-group">
        <label for="email">ایمیل</label>
        <input 
          type="email" 
          id="email" 
          name="email" 
          placeholder="example@email.com" 
          required
        >
      </div>

      <!-- دکمه ثبت‌نام -->
      <button type="submit" class="btn-register">ثبت‌نام</button>
    </form>

    <!-- لینک ورود -->
    <p class="login-link">
      قبلاً ثبت‌نام کرده‌اید؟ <a href="#">وارد شوید</a>
    </p>
  </div>

</body>
</html>
